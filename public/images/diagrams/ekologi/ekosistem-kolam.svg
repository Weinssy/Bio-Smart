<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610">
  <title>Tingkat organisasi di ekosistem kolam</title>
  <desc>Di kolam yang sama, ilustrasi berturut-turut memperlihatkan seekor katak, sekelompok katak, beberapa spesies, serta hubungan organisme dengan kolam dan cahaya.</desc>
  <defs>
    <radialGradient id="paper" cx="42%" cy="38%" r="76%">
      <stop stop-color="#f9fbf8" />
      <stop offset="1" stop-color="#e1eee7" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4c7765" opacity=".13" />
    </pattern>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#c0e8df" />
      <stop offset="1" stop-color="#7ab4b5" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#dbe6a8" />
      <stop offset="1" stop-color="#82ae77" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" viewBox="0 0 8 8">

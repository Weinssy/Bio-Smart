  </defs>
  <path fill="url(#paper)" d="M0 0h880v610H0Z" />
  <path fill="url(#grid)" d="M0 0h880v610H0Z" />
  <g fill="#f7fbf5" stroke="#a9c5b3" stroke-width="2.5">

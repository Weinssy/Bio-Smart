      <path d="M-20 9q-18-8-20 7-2 8 18 9m28-14q22-13 28 1 4 12-16 15" fill="#a7c781" stroke="#4b795a" stroke-width="2.5" stroke-linecap="round" />
      <path d="M-27 4q-4-20 12-21 3-9 12-8 7 0 9 7 10-4 14 4 3 11-11 20-21 12-36-2Z" fill="url(#leaf)" stroke="#4b795a" stroke-width="2.5" />
      <circle cx="-5" cy="-14" r="3" fill="#264b40" />
      <path d="M-25 0q13 5 23-3" stroke="#4b795a" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
    <g id="reed">
      <path d="M0 32Q8-16-17-37M2 31Q-12-11 9-60M1 31Q11 0 32-24" stroke="#507d63" stroke-width="3" fill="none" stroke-linecap="round" />

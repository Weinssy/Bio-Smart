      <path d="M-6-1h12" stroke="#d3e7bb" stroke-width="2" stroke-linecap="round" />
    </g>
    <g id="skin-section">
      <path d="M-109 0q53-15 109-1 59 14 109-3v86h-218Z" fill="url(#dermis)" stroke="#ae746e" stroke-width="2.5" />
      <path d="M-109-19q56-17 111-4 53 13 107-4V2Q54 17 0 4q-56-14-109 1Z" fill="url(#skin)" stroke="#ae746e" stroke-width="2.5" />
      <path d="M-101-10q53-14 96-3 62 16 106-1" fill="none" stroke="#fff1e8" stroke-width="3" stroke-linecap="round" />
    </g>
  </defs>
  <path fill="url(#paper)" d="M0 0h900v540H0Z" />
  <path fill="url(#grid)" d="M0 0h900v540H0Z" />
  <path d="M39 403q411-36 822 0" fill="none" stroke="#c0d4ca" stroke-width="2" />
  <g fill="none" stroke="#608779" stroke-width="3.5" stroke-dasharray="4 6">

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <title>Saat lapisan kulit terluka</title>
  <desc>Tiga potongan kulit menunjukkan penghalang utuh, masuknya partikel melalui luka, lalu satu sel imun mengelilingi partikel.</desc>
  <defs>
    <radialGradient id="paper" cx="42%" cy="38%" r="76%">
      <stop stop-color="#f9fbf8" />
      <stop offset="1" stop-color="#ede6df" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4c7765" opacity=".13" />
    </pattern>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f6cfc2" />
      <stop offset="1" stop-color="#e3a19c" />
    </linearGradient>
    <linearGradient id="dermis" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f5baac" />
      <stop offset="1" stop-color="#e2a195" />
    </linearGradient>
    <linearGradient id="phagocyte" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e5daf4" />
      <stop offset="1" stop-color="#ad92c8" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" viewBox="0 0 8 8">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#4f7769" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <g id="particle">
